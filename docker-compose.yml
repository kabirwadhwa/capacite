services:
  postgres:
    image: postgres:16-alpine
    container_name: coupdepaule-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: coupdepaule
      POSTGRES_PASSWORD: coupdepaule_dev_password
      POSTGRES_DB: coupdepaule_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
